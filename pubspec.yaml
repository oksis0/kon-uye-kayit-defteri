name: ortak_defteri
description: "Ortak Pay Defteri dijitalleştirme uygulaması"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # Navigasyon
  go_router: ^16.0.0

  # Yerel veritabanı
  drift: ^2.28.0
  drift_flutter: ^0.2.0
  path_provider: ^2.1.5
  path: ^1.9.0

  # Model üretimi
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  # Ağ
  dio: ^5.7.0

  # Dosya & görüntü
  file_picker: ^10.0.0
  image: ^4.3.0
  flutter_image_compress: ^2.3.0
  image_picker: ^1.1.2
  crypto: ^3.0.6

  # Yardımcı
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.0
  uuid: ^4.5.1
  csv: ^6.0.0
  window_manager: ^0.4.3

  cupertino_icons: ^1.0.8
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.13
  drift_dev: ^2.28.0
  riverpod_generator: ^3.0.0
  riverpod_lint: ^3.0.0
  custom_lint: ^0.8.1
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  # ★ Fontlar asset olarak gömülü — çevrimdışı çalışma garantisi için
  # (google_fonts paketi ilk açılışta internet ister, iş bu uygulamada kabul edilemez)
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
