name: Windows Build

# PLAN.md §1.2 — geliştirme macOS'ta, .exe derlemesi burada. Bu iş akışı
# derler + test eder; Windows'ta GERÇEKTEN AÇIP DENEMEK hâlâ gerekiyor
# (PLAN.md §1.1) — CI bunu yapamaz.
on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Bağımlılıkları al
        run: flutter pub get

      - name: Yapılandırma dosyasını oluştur
        # ★ ENV_JSON secret'ı henüz tanımlı değilse (Faz 1-2, Firebase/Worker
        # yok) örnek şablonla devam eder — CI erken fazlarda da yeşil kalır.
        shell: bash
        run: |
          if [ -n "${{ secrets.ENV_JSON }}" ]; then
            echo '${{ secrets.ENV_JSON }}' > env.json
          else
            cp env.ornek.json env.json
          fi

      - name: Kod üretimi (Drift/Freezed/Riverpod)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Statik analiz
        run: flutter analyze lib test

      - name: Testler
        run: flutter test

      - name: Windows masaüstü derlemesi
        run: flutter build windows --release --dart-define-from-file=env.json

      - name: .exe artefaktını yükle
        uses: actions/upload-artifact@v4
        with:
          name: ortak-defteri-windows
          path: build/windows/x64/runner/Release/
          retention-days: 14
